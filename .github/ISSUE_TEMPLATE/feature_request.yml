name: Feature request
description: Suggest a profile, protocol feature or improvement (English or Russian is fine).
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! English or Russian — both are welcome.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
      description: The use case matters more than the implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New ANT+ device profile
        - ANT protocol feature
        - ANT-FS
        - CLI / streaming integrations
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / spec reference
      description: Device model and the ANT+ spec section or page numbers, if available.
  - type: checkboxes
    id: contribute
    attributes:
      label: Willingness to help
      options:
        - label: I can test this against real hardware
        - label: I can help implement this
